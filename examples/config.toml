# examples/config.toml — a commented site configuration (every key with its
# range is in configs/reference.toml, generated from the registry). TOML: a #
# starts a comment. Layers apply in this order, the
# later winning by key: built-in defaults, /etc/karvi or /opt/karvi,
# ~/.config/karvi/config.toml, each --config root in order, KARVI__ variables,
# flags, --set. Try this file from the source root, where the relative
# paths below resolve:
#   karvi --config examples/config.toml config validate
#   karvi --config examples/config.toml run --dry-run --tf examples/targets.txt --cf examples/commands.txt

[config]
# The schema this file is written to; a binary that supports another major
# refuses the file and names its own.
schema-version = 6

# The inventory: one or more CSV sources. Rows are matched by the
# names given on the command line, by --tf files, or by selectors such as
# --site nyc and --group access.
[[inventory-source]]
name = "site-csv"
type = "csv"
path = "examples/inventory.csv"
required = true
# header: the first data line names the columns; numeric: no header row and
# every mapping is a 1-based column number.
mode = "header"
delimiter = ","
# A field must have a column before any row is read.
mandatory-fields = ["name", "platform"]
name-transform = "default"

# Which header holds which field; a field may list several headers, the
# first found wins. credkeyref is found under its own name without a mapping.
[inventory-source.mappings]
name = ["name", "hostname"]
management_address = ["management_address", "management_ip"]
platform = ["platform"]
transport = ["transport"]
site = ["site"]
groups = ["groups"]
session_cap = ["session_cap"]
attributes.owner = ["owner"]

# Every device name is lowercased before matching.
[name-transform.default]
operations = [{op = "lowercase"}]

# Credentials come from named backends in a policy's order. This one reads
# examples/credentials.csv's shape (docs/CREDENTIAL-CSV.md); the file itself
# is copied to ~/.karvi/credentials.csv at mode 0600, since a user-scoped
# file must be the operator's own.
[credential-backend.site-creds]
type = "csv"
scope = "user"
path = "~/.karvi/credentials.csv"
# An absent optional file is a silent not-found; true makes it an error.
required = false
mandatory-fields = ["username", "password"]

# A RANCID .cloginrc read as data (examples/cloginrc), for a site that keeps
# one; name it in a policy's backend-sequence to use it.
[credential-backend.rancid]
type = "cloginrc"
scope = "user"
required = false
path = "~/.cloginrc"

# A shared file is the site's: always required, an absolute path, mode 0640,
# owned by root or one of security.approved-admin-users, in the group
# security.shared-group. A relative include resolves beside the file that
# includes it and keeps its scope.
# [credential-backend.shared-rancid]
# type = "cloginrc"
# scope = "shared"
# required = true
# path = "/etc/karvi/credentials/cloginrc"

# The environment, last: the templates below with the operator's login name
# in %s (KARVI_netops_USERNAME for the operator netops), one credential for
# every device this backend serves; then the built-in NETUSER, NETPASS, and
# NETENABLE (docs/OPERATIONS.md, "The environment backend").
[credential-backend.operator-env]
type = "env"
username-var-template = "KARVI_%s_USERNAME"
password-var-template = "KARVI_%s_PASSWORD"
enable-var-template = "KARVI_%s_ENABLE_PASSWORD"

# The policy every device takes (the map's name = "*" rule): the CSV first,
# then the environment. A device pinned by credkeyref takes only the CSV row
# whose credkey equals it.
[credential-policy.default]
backend-sequence = ["site-creds", "operator-env"]

[[credential-policy-map]]
policy = "default"
name = "*"

# A platform alias: c9300 is IOS XE with one paging command, its
# own collection list, and the built-in drop list. Inventory rows name the
# alias by its own name.
[platform.c9300]
driver = "cisco_iosxe"
paging-commands = ["terminal length 0"]
crun-commands = ["show running-config", "show version", "show inventory"]
# The drop list for the collection file (docs/COLLECTION.md): regular
# expressions in literal strings, so a backslash stays one; a matching line
# is left out of the collection file and nowhere else. An array replaces the
# built-in list whole, and [] turns the filter off.
# crun-filters = ['^Building configuration\.\.\.$', '^Current configuration : \d+ bytes$']

# A generic device (a row set to generic, a row without a platform under
# platform-resolution.default = "generic", or --pg) is sent nothing before
# the commands; this gives it start statements (docs/OPERATIONS.md, "Start
# statements for generic devices").
# [platform.generic]
# paging-commands = ["terminal length 0", "terminal width 512"]

# A platform-less row runs as default; a row naming an unknown platform
# refuses the activity under fail, or runs as unknown-fallback under warn.
[platform-resolution]
default = "cisco_iosxe"
on-unknown = "fail"
unknown-fallback = "generic"

# Session initialization: a profile's commands run after the paging setup and
# before the requested commands; the map picks one profile per device by the
# credential map's matching and ends in a name = "*" rule. Without a map no
# profile runs.
# [session-init.iosxe-wide]
# commands = ["terminal width 511"]
# on-error = "continue"
# command-timeout = "15s"
#
# [session-init.none-sent]
# commands = []
#
# [[session-init-map]]
# profile = "iosxe-wide"
# platform = "cisco_iosxe"
#
# [[session-init-map]]
# profile = "none-sent"
# name = "*"

# The collection run (docs/COLLECTION.md): one file per device in one flat
# directory, replaced only when the device's collection succeeded. auto is the
# shared crun tree, else <basedir>/crun; a site shares one by making it once
# with chgrp and chmod 2770. after names a hook run once the collection ends.
[crun]
directory = "auto"
directory-mode = "0770"
file-mode = "0660"
after = ""
after-timeout = "5m"

# The transport each mode uses when the inventory row leaves it blank:
# system is OpenSSH, native is scrapligo-v1 (karvi's own connection).
[ssh.login]
transport = "system"
[ssh.command]
transport = "native"
[ssh.run]
transport = "native"

# The trust store: accept-new enrolls a new host key and refuses a changed
# one; secure requires prior enrollment; insecure accepts all with warnings.
[ssh]
host-key-policy = "accept-new"

# Algorithms beyond [ssh-algorithms] (the defaults are in
# configs/reference.toml): a profile appends last resorts or replaces a list,
# and the map picks it per device; a catch-all rule is refused.
# [ssh-algorithms-profile.legacy-ios]
# kex-append = ["diffie-hellman-group1-sha1"]
# ciphers-append = ["aes128-ctr", "aes128-cbc"]
#
# [[ssh-algorithms-map]]
# profile = "legacy-ios"
# device-group = "legacy-access"
#
# Each transport's own key exchanges, ciphers, and MACs (OpenSSH's or
# x/crypto's defaults) in place of karvi's, the host-key list staying
# karvi's; a profile's source chooses per device, and under "transport" a
# profile that sets those lists says source = "karvi".
# [ssh-algorithms]
# source = "transport"

# Concurrency for run: serial, parallel, or wave (the CPU-governed ramp);
# 0 workers means the logical CPU count.
[dispatch]
default = "parallel"
parallel-workers = 0
# default keeps the inventory's order; sorted, shuffle, and random are the
# others, and a shuffle is reproducible from its key.
order = "default"

# The display: the theme, and the header line above each device's output.
# <target>, <address>, <platform>, <user>, <transport> are placeholders.
[display]
theme = "dark"
color = "auto"

# The job's files under <basedir>/jobs/YYMMDD/<id>: output.TARGET.txt per
# device, commands.jsonl (the records), summary.json, and the rest. Group
# read on the folders lets a team follow each other's jobs.
[output]
directory-mode = "0750"

# The audit: journald is required where the host has it. A container or a
# workstation without journald writes the audit to a file instead.
# [audit]
# journald-required = false
# file = "~/.local/share/karvi/audit.jsonl"
