# karvi's scratch root, written by: sudo karvi setup shared
# systemd-tmpfiles makes it again at every boot (/dev/shm is a tmpfs), in
# the operators' group. Run setup shared again to change the group or the
# mode; this file is then replaced.
d /dev/shm/karvi 3770 root netops - -
d /dev/shm/karvi/scoreboards 3770 root netops - -
d /dev/shm/karvi/capacity 2770 root netops - -
d /dev/shm/karvi/capacity/devices 2770 root netops - -
